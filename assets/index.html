<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heimdash</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/datastar.js"></script>
  </head>
  <body>
    <main>
      <div class="terminal">
        <div class="frame-title">HEIMDASH</div>

        <div class="titlebar">
          <span class="deck">DECK 01</span>
          <span class="live"><i class="dot"></i>LIVE</span>
        </div>

        <div class="screen">
          <header id="hostline">
            <h1>heimdash</h1>
            <span id="uptime"></span>
          </header>

          <div class="dashboard-grid">
            <section id="metrics">
              <h2>Disks</h2>
              <ul id="disks"></ul>
            </section>

            <section class="service-panel">
              <h2>Services</h2>
              <ul id="services"></ul>
            </section>
          </div>
        </div>
      </div>
    </main>

    <div hidden data-on-interval__duration.30s.leading="@get('/poll')"></div>
  </body>
</html>
