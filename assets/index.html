<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>heimdash</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff9d42' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='3' fill='%23070604' stroke='none'/%3E%3Cpath d='M22 17a10 10 0 0 0-20 0'/%3E%3Cpath d='M6 17a6 6 0 0 1 12 0'/%3E%3Cpath d='M10 17a2 2 0 0 1 4 0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/datastar.js"></script>
  </head>
  <body>
    <main>
      <div class="terminal">
        <div class="frame-title">HEIMDASH</div>

        <div class="titlebar">
          <span class="live"><i class="dot"></i>LIVE</span>
        </div>

        <div class="screen">
          <header id="hostline">
            <h1>heimdash</h1>
            <span id="uptime"></span>
          </header>

          <div class="dashboard-grid">
            <section id="metrics">
              <h2>Disks</h2>
              <ul id="disks"></ul>
            </section>

            <section class="service-panel">
              <h2>Services</h2>
              <ul id="services"></ul>
            </section>
          </div>
        </div>
      </div>
    </main>

    <div hidden data-on-interval__duration.30s.leading="@get('/poll')"></div>
    <div
      hidden
      data-on-interval__duration.60s.leading="@get('/poll/services')"
    ></div>
  </body>
</html>
